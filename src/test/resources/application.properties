spring.application.name=demo-bcnc-test

# Desactiva el perfil dev para no depender de application-dev.properties no versionado
spring.profiles.active=

# H2 en memoria para tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console desactivada en tests
spring.h2.console.enabled=false

# Esquema gestionado por schema.sql / data.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=always

# Cache Caffeine
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
